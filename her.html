<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>HER-SEARCH MAKEUP</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&amp;family=Manrope:wght@200..800&amp;family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&amp;display=swap" rel="stylesheet">

<style>

        }
        
        .glass-card {
            background: rgba(58, 51, 52, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(243, 183, 194, 0.1);
        }

        .inner-glow {
            box-shadow: inset 0 0 12px rgba(243, 183, 194, 0.1);
        }

        .button-glow {
            box-shadow: 0 0 20px rgba(236, 185, 196, 0.2);
        }
    </style>
<script id="tailwind-config">

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#f3b7c2",
                        "surface-dim": "#181213",
                        "inverse-surface": "#ecdfe0",
                        "primary-fixed-dim": "#f3b7c2",
                        "tertiary-fixed": "#ffd9df",
                        "on-error": "#690005",
                        "secondary": "#ecb9c4",
                        "on-surface": "#ecdfe0",
                        "background": "#181213",
                        "primary-fixed": "#ffd9df",

                        "outline": "#9d8d8f",
                        "on-secondary-container": "#d9a8b2",
                        "outline-variant": "#504445",
                        "on-error-container": "#ffdad6",
                        "on-surface-variant": "#d5c2c4",
                        "surface-variant": "#3a3334",
                        "surface-container": "#241e1f",
                        "secondary-fixed": "#ffd9e0",
                        "on-tertiary-container": "#ffe7e9",
                        "on-secondary": "#48272f",
                        "surface-bright": "#3f3738",
                        "inverse-primary": "#80515b",
                        "inverse-on-surface": "#362f30",
                        "surface": "#181213",
                        "secondary-fixed-dim": "#ecb9c4",
                        "tertiary-fixed-dim": "#e8bbc2",
                        "surface-container-highest": "#3a3334",
                        "on-secondary-fixed-variant": "#613c45",
                        "on-primary": "#4c242e",
                        "surface-container-low": "#201a1b",
                        "surface-tint": "#f3b7c2",
                        "on-primary-container": "#ffe6e9",

                        "error": "#ffb4ab",

                        "on-tertiary-fixed": "#2d1419",

                        "on-primary-fixed-variant": "#653a44"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "margin-desktop": "48px",
                        "container-max": "1200px",
                        "margin-mobile": "16px",
                        "unit": "4px"

                    "fontFamily": {
                        "display-lg": ["Playfair Display"],
                        "headline-md": ["Playfair Display"],

                        "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],

<style>
        body {
            min-height: 100dvh;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen overflow-x-hidden selection:bg-primary/30 flex flex-col">
<!-- TopAppBar -->

<!-- Main Content Canvas -->
<main class="flex-1 relative z-10 flex flex-col items-center justify-center px-gutter">
<div class="w-full max-w-xl"><header class="w-full flex items-center justify-center mb-8">
<h1 class="font-display-lg text-lg md:text-xl tracking-widest text-primary/80 uppercase">
        HER-SEARCH MAKEUP
    </h1>
</header>
<!-- Search Interaction Area -->
<div class="w-full relative group">
<div class="relative flex flex-col items-center gap-6 w-full p-6 glass-card rounded-[40px] transition-all duration-500 hover:border-primary/30">
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary/40">search</span>
<input class="w-full bg-transparent border-none focus:ring-0 pl-12 pr-4 py-2 font-body-md text-on-surface placeholder:text-on-surface-variant/30 text-lg" placeholder="Search shades, brands..." type="text">
</div>
<button class="w-full py-4 bg-primary text-on-primary font-title-lg rounded-full flex items-center justify-center gap-2 button-glow transition-all active:scale-[0.98] hover:opacity-90 duration-300">
<span class="">Go</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</div>
</div>
</main>
<script>
    // Search input micro-interaction
    const searchInput = document.querySelector('input');
    const searchContainer = searchInput.closest('.glass-card');

    searchInput.addEventListener('focus', () => {
        searchContainer.classList.add('inner-glow', 'border-primary/40');
    });

    searchInput.addEventListener('blur', () => {
        searchContainer.classList.remove('inner-glow', 'border-primary/40');
    });
</script>


</body></html>
